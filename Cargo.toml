[workspace]
members = ["crates/core", "crates/pipeline", "crates/wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

# Science bugs hide in exact float compares and lossy int16/f64 casts (DEM tiles, az bins).
# An intended cast gets #[allow(clippy::<lint>)] with a one-line reason.
[workspace.lints.clippy]
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[profile.release]
opt-level = 3
lto = true
